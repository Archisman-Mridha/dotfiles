apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  labels:
    app.tanka.grafana.com: harbor
  name: harbor
  namespace: harbor
spec:
  authentication:
    passwordFromSecret:
      key: password
      name: harbor-dragonfly-credentials
  replicas: 2
  resources:
    limits:
      cpu: 600m
      memory: 750Mi
    requests:
      cpu: 500m
      memory: 500Mi
