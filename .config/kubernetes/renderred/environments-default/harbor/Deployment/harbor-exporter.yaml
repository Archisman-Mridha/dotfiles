apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: harbor
    app.kubernetes.io/component: exporter
    app.kubernetes.io/instance: harbor
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: harbor
    app.kubernetes.io/part-of: harbor
    app.kubernetes.io/version: 2.15.1
    app.tanka.grafana.com: harbor
    chart: harbor
    component: exporter
    heritage: Helm
    release: harbor
  name: harbor-exporter
  namespace: harbor
spec:
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: harbor
      component: exporter
      release: harbor
  template:
    metadata:
      annotations:
        checksum/configmap: 41900583f07b126fbbe78326bb4be46b862c851ca0ca4e26da890213fa9c821b
        checksum/secret: 47c2094e3e9f17a73662460f6e5faa73feb41ed2c2306153ebefd62ba64cf7e9
      labels:
        app: harbor
        app.kubernetes.io/component: exporter
        app.kubernetes.io/instance: harbor
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: harbor
        app.kubernetes.io/part-of: harbor
        app.kubernetes.io/version: 2.15.1
        chart: harbor
        component: exporter
        heritage: Helm
        release: harbor
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - -log-level
        - info
        env:
        - name: HARBOR_DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: harbor-app
        envFrom:
        - configMapRef:
            name: harbor-exporter-env
        - secretRef:
            name: harbor-exporter
        image: docker.io/goharbor/harbor-exporter:v2.15.1
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 300
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        name: exporter
        ports:
        - containerPort: 8001
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /
            port: 8001
          initialDelaySeconds: 30
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        volumeMounts: null
      securityContext:
        fsGroup: 10000
        runAsUser: 10000
      volumes:
      - name: config
        secret:
          secretName: harbor-exporter
