apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: cilium-operator
    app.kubernetes.io/part-of: cilium
    app.tanka.grafana.com: cilium
    helm.sh/chart: cilium-1.20.0
  name: cilium-operator
  namespace: cilium
spec:
  endpoints:
  - honorLabels: true
    interval: 10s
    path: /metrics
    port: metrics
  namespaceSelector:
    matchNames:
    - cilium
  selector:
    matchLabels:
      io.cilium/app: operator
      name: cilium-operator
  targetLabels:
  - io.cilium/app
