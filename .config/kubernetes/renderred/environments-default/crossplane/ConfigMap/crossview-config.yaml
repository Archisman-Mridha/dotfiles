apiVersion: v1
data:
  AUTH_CREATE_USERS: "true"
  AUTH_DEFAULT_ROLE: viewer
  AUTH_MODE: none
  AUTH_TRUSTED_HEADER: X-Auth-User
  CORS_ORIGIN: http://localhost:5173
  DB_ENABLED: "false"
  DB_HOST: crossview-postgres
  DB_NAME: crossview
  DB_PORT: "5432"
  DB_SSL_CERT: ""
  DB_SSL_KEY: ""
  DB_SSL_MODE: disable
  DB_SSL_ROOT_CERT: ""
  DB_USER: postgres
  LOG_LEVEL: info
  OIDC_AUTHORIZATION_URL: ""
