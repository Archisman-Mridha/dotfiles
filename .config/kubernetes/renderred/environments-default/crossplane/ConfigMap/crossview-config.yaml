  OIDC_TOKEN_URL: ""
  OIDC_USERINFO_URL: ""
  OIDC_USERNAME_ATTRIBUTE: preferred_username
  PORT: "3001"
  SAML_CALLBACK_URL: http://localhost:3001/api/auth/saml/callback
  SAML_EMAIL_ATTRIBUTE: http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress
