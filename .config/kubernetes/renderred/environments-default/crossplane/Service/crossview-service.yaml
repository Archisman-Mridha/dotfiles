apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: crossview
    app.kubernetes.io/managed-by: Helmraiser
    app.kubernetes.io/name: crossview
    app.kubernetes.io/version: v3.9.0-rc.4
    app.tanka.grafana.com: crossplane
    helm.sh/chart: crossview-3.9.0-rc.4
  name: crossview-service
  namespace: crossplane
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 3001
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: crossview
    app.kubernetes.io/name: crossview
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
  type: ClusterIP
